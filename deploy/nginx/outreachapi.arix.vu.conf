server {
    listen 80;
    listen [::]:80;
    server_name outreachapi.arix.vu;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name outreachapi.arix.vu;

    # После certbot сюда подставятся сертификаты, либо укажи вручную:
    # ssl_certificate     /etc/letsencrypt/live/outreachapi.arix.vu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/outreachapi.arix.vu/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
